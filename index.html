<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zombie Survival</title>
  <link rel="stylesheet" href="style.css?v=1c7f0c1e">
</head>
<body>
  <div id="app">
    <header>
      <div id="banner" class="who"></div>
      <div class="hbtns">
        <button id="logtoggle" title="Show/hide log (Tab)">📜 Show log</button>
        <button id="mute" title="Sound on/off (M)">🔊</button>
        <button id="newgame" title="New game"><span class="ic">🔄</span><span class="lbl">New game</span></button>
      </div>
    </header>
    <main>
      <section id="board"><svg id="map"></svg><div id="mapframe"></div>
        <svg id="clock" viewBox="-110 -110 220 220" aria-label="Round clock and AP">
          <g id="wedges"></g>
          <g id="apring"></g>
          <g id="hand"><path d="M0 -100 L-7 -110 L7 -110 Z"/></g>
          <circle r="28" class="hub"/>
          <text y="-6" class="dl" id="clocklabel">Day</text>
          <text y="14" class="dn" id="clockday">1</text>
        </svg><div id="timer"></div><div id="msgs"><div id="notes"></div><div id="hint"></div><div id="toast"></div></div><div id="dock"><div id="actions"></div></div><div id="rightcol"><div id="pack"></div><div id="stats"></div></div><div id="leadmarks"></div><div id="roundbanner" hidden></div><div id="popup" hidden></div><div id="pauseveil" hidden><div class="pv-title">⏸ Paused</div><div class="pv-sub">Press <kbd>P</kbd> or click to carry on</div></div></section>
      <aside id="panel">
        <details id="playersbox" open>
          <summary class="chathead">Players</summary>
          <div id="players"></div>
        </details>
        <div class="chathead">Log</div>
        <div id="log"></div>
        <form id="chatform" autocomplete="off">
          <input id="chatinput" placeholder="Write a note…" maxlength="300">
          <button type="submit">Send</button>
        </form>
      </aside>
    </main>
  </div>

  <script src="locations.js?v=64bd98c3"></script>
  <script src="data.js?v=aaf80077"></script>
  <script src="engine.js?v=9ff9bf55"></script>
  <script src="game.js?v=bc67e52f"></script>
</body>
</html>
